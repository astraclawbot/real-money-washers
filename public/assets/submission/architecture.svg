<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" role="img" aria-labelledby="title desc">
<title id="title">Static website delivery architecture</title><desc id="desc">A visitor sends an HTTPS request to Amazon CloudFront, which returns website content. On a cache miss, CloudFront makes a signed request using Origin Access Control to a private Amazon S3 bucket. S3 returns the requested files. Block Public Access is enabled.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#242827"/></marker></defs>
<rect width="1080" height="760" fill="#f3f6f4"/>
<g stroke="#242827" stroke-width="2"><rect x="260" y="30" width="560" height="130" rx="8" fill="#fff"/><rect x="260" y="285" width="560" height="170" rx="8" fill="#e6ee53"/><rect x="260" y="590" width="560" height="140" rx="8" fill="#d9eef3"/></g>
<g fill="#242827" font-family="Arial, sans-serif" text-anchor="middle"><text x="540" y="104" font-size="30" font-weight="700">Visitor’s browser</text><text x="540" y="337" font-size="30" font-weight="700">Amazon CloudFront</text><text x="540" y="382" font-size="23">Caches and delivers content</text><text x="540" y="420" font-size="23">Default root object: index.html</text><text x="540" y="638" font-size="30" font-weight="700">Private Amazon S3 bucket</text><text x="540" y="675" font-size="23">Stores website files</text><text x="540" y="708" font-size="23">Block Public Access enabled</text></g>
<g fill="none" stroke="#242827" stroke-width="2.5" marker-end="url(#arrow)"><path d="M350 160V279"/><path d="M730 285V166"/><path d="M350 455V584"/><path d="M730 590V461"/></g>
<g fill="#242827" font-family="Arial, sans-serif" font-size="22"><text x="330" y="215" text-anchor="end">HTTPS</text><text x="330" y="244" text-anchor="end">request</text><text x="750" y="215">Website</text><text x="750" y="244">content</text><text x="330" y="501" text-anchor="end">Cache miss: signed</text><text x="330" y="531" text-anchor="end">request using OAC</text><text x="750" y="515">Requested files</text></g></svg>
